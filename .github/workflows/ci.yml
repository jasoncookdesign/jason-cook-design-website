name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit and component tests
        run: npx jest
      - name: Build
        run: npm run build
      - name: Real-browser tests
        run: npx playwright test
